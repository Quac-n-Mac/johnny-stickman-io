<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Johnny Stickman</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #gate{max-width:420px;margin:12vh auto;padding:24px;background:#1c1c1c;border-radius:12px;box-shadow:0 4px 30px #0008}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:#999;font-size:.85rem;margin-bottom:18px}
  button,.game{display:block;width:100%;padding:12px;margin:8px 0;background:#2d5f2f;border:0;border-radius:8px;color:#fff;font-size:1rem;cursor:pointer;text-align:center}
  button:hover,.game:hover{background:#3a7a3d}
  input[type=password]{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#111;border:1px solid #444;border-radius:8px;color:#fff;font-size:1rem}
  #bar{height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:12px;display:none}
  #fill{height:100%;width:0;background:#4caf50;transition:width .2s}
  #msg{color:#f88;font-size:.85rem;min-height:1.2em;margin-top:8px}
  #pct{color:#9c9;font-size:.8rem}
  iframe{border:0;position:fixed;inset:0;width:100vw;height:100vh;display:none;background:#000}
</style>
</head>
<body>
<div id="gate">
  <h1>Johnny Stickman</h1>
  <div class="sub">Pick a game, enter the password, play right here.</div>
  <div id="picker"></div>
  <div id="pwbox" style="display:none">
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button id="go">Unlock &amp; play</button>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct"></div>
  <div id="msg"></div>
</div>
<iframe id="frame" allow="autoplay; fullscreen; keyboard; pointer-lock; gamepad"></iframe>
<script>
const GAMES = [
  {label:"Game 1 - the 4-in-1 collection (203 MB)", dir:"henry-main"},
  {label:"Game 2 - the prison one (112 MB)", dir:"henry-ftc"},
  {label:"Game 3 - missions part 1 (199 MB)", dir:"henry-ctm"},
  {label:"Game 4 - missions part 2 (211 MB)", dir:"henry-ctm2"}
];
const picker = document.getElementById('picker');
const pwbox = document.getElementById('pwbox');
const pw = document.getElementById('pw');
const msg = document.getElementById('msg');
const bar = document.getElementById('bar');
const fill = document.getElementById('fill');
const pct = document.getElementById('pct');
let current = null;

function pick(g){
  current = g;
  picker.style.display = 'none';
  pwbox.style.display = 'block';
  msg.textContent = '';
  pw.focus();
  pw.onkeydown = e => { if (e.key === 'Enter') go(); };
}
function b64(s){ const bin = atob(s); const u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
async function go(){
  const pass = pw.value;
  if (!pass) { msg.textContent = 'Enter the password.'; return; }
  document.getElementById('go').disabled = true;
  msg.textContent = '';
  bar.style.display = 'block';
  try {
    pct.textContent = 'deriving key...';
    const m = await (await fetch(current.dir + '/manifest.json')).json();
    const salt = b64(m.salt);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:m.iterations, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const parts = [];
    let done = 0;
    for (let i=0;i<m.chunks.length;i++){
      pct.textContent = 'loading ' + Math.round(done/m.size*100) + '%';
      const buf = await (await fetch(current.dir + '/' + m.chunks[i])).arrayBuffer();
      const iv = new Uint8Array(buf, 0, 12);
      let plain;
      try {
        plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, buf.slice(12));
      } catch(e) {
        throw new Error('wrong-password');
      }
      parts.push(plain);
      done += plain.byteLength;
      fill.style.width = Math.round(done/m.size*100) + '%';
    }
    pct.textContent = 'starting...';
    const blob = new Blob(parts, {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const f = document.getElementById('frame');
    f.style.display = 'block';
    f.src = url;
    document.getElementById('gate').style.display = 'none';
  } catch(e) {
    document.getElementById('go').disabled = false;
    bar.style.display = 'none'; fill.style.width = '0'; pct.textContent = '';
    msg.textContent = (e && e.message === 'wrong-password') ? 'Wrong password.' : ('Load failed: ' + e);
  }
}
document.getElementById('go').onclick = go;
GAMES.forEach(g => {
  const b = document.createElement('button');
  b.className = 'game';
  b.textContent = g.label;
  b.onclick = () => pick(g);
  picker.appendChild(b);
});
if (GAMES.length === 1) pick(GAMES[0]);
</script>
</body>
</html>
